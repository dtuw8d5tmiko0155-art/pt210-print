<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>58mm Thermal Printer Web Print (日本語対応)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-6 px-4">

    <div class="max-w-md mx-auto space-y-4">
        
        <header class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white text-xl shadow-md">
                    <i class="fa-solid fa-print"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">Web Bluetooth レシート印刷</h1>
                    <p class="text-xs text-slate-500">GOOJPRT PT-210 / 58mm プリンター対応 (日本語完全対応)</p>
                </div>
            </div>
        </header>

        <div id="iframeWarning" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded-xl shadow-sm text-xs text-amber-900 space-y-2">
            <div class="flex items-center space-x-2 font-bold text-amber-700">
                <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                <span>プレビュー環境（iFrame）の制限について</span>
            </div>
            <p>
                セキュリティ仕様により、Web Bluetooth機能はブラウザのプレビュー枠内では実行できません。
                以下のボタンからファイルをダウンロードし、Chrome等のブラウザで直接ファイルを開いてご使用ください。
            </p>
            <button id="downloadBannerBtn" class="w-full mt-1 py-2 px-3 bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white font-bold rounded-lg transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-file-arrow-down"></i>
                <span>HTMLファイルを保存して直接開く</span>
            </button>
        </div>

        <main class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div>
                <label for="titleText" class="block text-xs font-bold text-slate-700 mb-1">
                    <i class="fa-solid fa-heading mr-1"></i> タイトル (日本語OK)
                </label>
                <input type="text" id="titleText" value="" placeholder="例: 店舗名・タイトル" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white font-sans">
            </div>

            <div>
                <label for="bodyText" class="block text-xs font-bold text-slate-700 mb-1">
                    <i class="fa-solid fa-align-left mr-1"></i> 印刷メッセージ (日本語OK)
                </label>
                <textarea id="bodyText" rows="4" placeholder="例: ご来店ありがとうございます！&#10;領収書 / レシート本文" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white font-sans"></textarea>
            </div>

            <div>
                <label for="imageInput" class="block text-xs font-bold text-slate-700 mb-1">
                    <i class="fa-solid fa-qrcode mr-1"></i> QRコード画像アップロード (任意)
                </label>
                <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            </div>

            <div id="previewContainer" class="hidden border border-dashed border-slate-300 p-3 rounded-xl bg-slate-50 text-center space-y-2">
                <span class="text-[11px] font-bold text-slate-500 block">QRコード プレビュー</span>
                <canvas id="previewCanvas" class="mx-auto border border-slate-200 bg-white shadow-sm max-w-full h-auto rounded"></canvas>
            </div>

            <button id="printBtn" type="button" class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                <i class="fa-brands fa-bluetooth text-lg"></i>
                <span>Bluetooth プリンターに接続して印刷</span>
            </button>

            <button id="downloadFileBtn" type="button" class="w-full py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-xs rounded-lg transition flex items-center justify-center space-x-1 border border-slate-200">
                <i class="fa-solid fa-download"></i>
                <span>スタンドアロンHTMLファイルを保存</span>
            </button>
        </main>

        <div class="bg-slate-900 text-slate-200 p-4 rounded-2xl text-xs font-mono shadow-md">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-2">
                <span class="font-bold text-slate-400"><i class="fa-solid fa-terminal mr-1"></i> 通信ログ</span>
                <button id="clearLogBtn" class="text-slate-500 hover:text-slate-300 text-[10px]">クリア</button>
            </div>
            <div id="logOutput" class="h-28 overflow-y-auto space-y-1 text-[11px] leading-relaxed">
                <div class="text-slate-500">> 待機中... 印刷ボタンを押してください。</div>
            </div>
        </div>

    </div>

    <canvas id="hiddenCanvas" class="hidden"></canvas>

    <script>
        const KNOWN_SERVICES = [
            '00001101-0000-1000-8000-00805f9b34fb',
            '0000ff00-0000-1000-8000-00805f9b34fb',
            '0000fee7-0000-1000-8000-00805f9b34fb',
            '0000af00-0000-1000-8000-00805f9b34fb',
            'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
        ];

        let loadedImage = null;

        function log(message, type = 'info') {
            const logOutput = document.getElementById('logOutput');
            const entry = document.createElement('div');
            const time = new Date().toLocaleTimeString('ja-JP');
            
            if (type === 'error') entry.className = 'text-red-400 font-bold';
            else if (type === 'success') entry.className = 'text-emerald-400 font-bold';
            else if (type === 'warn') entry.className = 'text-amber-400';
            else entry.className = 'text-slate-300';

            entry.textContent = `[${time}] ${message}`;
            logOutput.appendChild(entry);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        function checkEnvironment() {
            if (window.self !== window.top) {
                document.getElementById('iframeWarning').classList.remove('hidden');
                log('注意: プレビュー画面(iFrame)でのWeb Bluetooth実行はブラウザ仕様でブロックされています。HTMLファイルを保存して開いてください。', 'warn');
            }
        }

        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) {
                loadedImage = null;
                document.getElementById('previewContainer').classList.add('hidden');
                return;
            }

            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    loadedImage = img;
                    renderMonochromePreview(img);
                    document.getElementById('previewContainer').classList.remove('hidden');
                    log('QRコード画像を読み込みました。', 'success');
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        function renderMonochromePreview(img) {
            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');
            const targetWidth = 384; 
            const scale = targetWidth / img.width;
            const targetHeight = Math.floor(img.height * scale);

            canvas.width = targetWidth;
            canvas.height = targetHeight;

            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, targetWidth, targetHeight);
            ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

            const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const pixels = imgData.data;

            for (let i = 0; i < pixels.length; i += 4) {
                const brightness = pixels[i] * 0.299 + pixels[i + 1] * 0.587 + pixels[i + 2] * 0.114;
                const v = brightness < 128 ? 0 : 255;
                pixels[i] = v;     
                pixels[i + 1] = v; 
                pixels[i + 2] = v; 
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function renderTextToCanvas(title, body) {
            const width = 384;
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCanvas.width = width;
            tempCanvas.height = 2000;

            let y = 10;

            if (title.trim() !== "") {
                tempCtx.font = "bold 28px 'sans-serif', 'Hiragino Sans', 'Meiryo'";
                tempCtx.textAlign = "center";
                tempCtx.fillStyle = "#000000";

                const titleLines = wrapText(tempCtx, title, width - 20);
                for (const line of titleLines) {
                    tempCtx.fillText(line, width / 2, y + 28);
                    y += 36;
                }
                y += 10;

                tempCtx.beginPath();
                tempCtx.setLineDash([4, 4]);
                tempCtx.moveTo(10, y);
                tempCtx.lineTo(width - 10, y);
                tempCtx.strokeStyle = "#000000";
                tempCtx.lineWidth = 2;
                tempCtx.stroke();
                tempCtx.setLineDash([]);
                y += 20;
            }

            if (body.trim() !== "") {
                tempCtx.font = "22px 'sans-serif', 'Hiragino Sans', 'Meiryo'";
                tempCtx.textAlign = "left";
                tempCtx.fillStyle = "#000000";

                const bodyParagraphs = body.split('\n');
                for (const para of bodyParagraphs) {
                    if (para.trim() === '') {
                        y += 15;
                        continue;
                    }
                    const lines = wrapText(tempCtx, para, width - 20);
                    for (const line of lines) {
                        tempCtx.fillText(line, 10, y + 22);
                        y += 30;
                    }
                }
                y += 15;
            }

            const finalHeight = Math.max(y, 1);
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = width;
            finalCanvas.height = finalHeight;
            const finalCtx = finalCanvas.getContext('2d');

            finalCtx.fillStyle = "#FFFFFF";
            finalCtx.fillRect(0, 0, width, finalHeight);
            finalCtx.drawImage(tempCanvas, 0, 0);

            return finalCanvas;
        }

        function wrapText(ctx, text, maxWidth) {
            const lines = [];
            let currentLine = '';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const testLine = currentLine + char;
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    lines.push(currentLine);
                    currentLine = char;
                } else {
                    currentLine = testLine;
                }
            }
            if (currentLine) lines.push(currentLine);
            return lines;
        }

        function convertCanvasToEscPos(sourceCanvas) {
            const width = sourceCanvas.width;
            const height = sourceCanvas.height;
            const ctx = sourceCanvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, width, height);
            const pixels = imgData.data;

            const widthBytes = Math.ceil(width / 8); // 48バイト
            const imageBytes = new Uint8Array(widthBytes * height);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const brightness = pixels[idx] * 0.299 + pixels[idx + 1] * 0.587 + pixels[idx + 2] * 0.114;
                    if (brightness < 128) {
                        const byteIndex = y * widthBytes + Math.floor(x / 8);
                        const bitIndex = 7 - (x % 8);
                        imageBytes[byteIndex] |= (1 << bitIndex);
                    }
                }
            }

            const xL = widthBytes & 0xFF;
            const xH = (widthBytes >> 8) & 0xFF;
            const yL = height & 0xFF;
            const yH = (height >> 8) & 0xFF;

            const header = new Uint8Array([0x1D, 0x76, 0x30, 0x00, xL, xH, yL, yH]);
            const combined = new Uint8Array(header.length + imageBytes.length);
            combined.set(header);
            combined.set(imageBytes, header.length);

            return combined;
        }

        // 10mm (80ドット) 分の白い空白のラスタデータを生成する関数
        function createBottomMarginEscPos() {
            const width = 384;
            const height = 80; // 10mm分 (10mm * 8ドット = 80ドット)
            const widthBytes = 48; // 384 / 8
            const imageBytes = new Uint8Array(widthBytes * height); // すべて0 (白)

            const xL = widthBytes & 0xFF;
            const xH = (widthBytes >> 8) & 0xFF;
            const yL = height & 0xFF;
            const yH = (height >> 8) & 0xFF;

            const header = new Uint8Array([0x1D, 0x76, 0x30, 0x00, xL, xH, yL, yH]);
            const combined = new Uint8Array(header.length + imageBytes.length);
            combined.set(header);
            combined.set(imageBytes, header.length);

            return combined;
        }

        function downloadStandaloneHtml() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'pt210_web_printer.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            log('HTMLファイルを保存しました。', 'success');
        }

        document.getElementById('downloadFileBtn').addEventListener('click', downloadStandaloneHtml);
        document.getElementById('downloadBannerBtn').addEventListener('click', downloadStandaloneHtml);
        document.getElementById('clearLogBtn').addEventListener('click', () => {
            document.getElementById('logOutput').innerHTML = '<div class="text-slate-500">> ログをクリアしました。</div>';
        });

        document.getElementById('printBtn').addEventListener('click', async () => {
            if (window.self !== window.top) {
                alert("【実行制限エラー】\n\niFrame画面内ではBluetooth通信がブロックされています。\n「スタンドアロンHTMLファイルを保存」を押してローカルで開いて実行してください。");
                return;
            }

            if (!navigator.bluetooth) {
                alert("お使いのブラウザはWeb Bluetoothに対応していません。Google Chrome等を使用してください。");
                return;
            }

            const title = document.getElementById('titleText').value;
            const body = document.getElementById('bodyText').value;

            try {
                log('Bluetoothデバイスをスキャン中...');
                
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: KNOWN_SERVICES
                });

                log(`デバイス「${device.name || 'Printer'}」を選択しました。接続中...`);
                const server = await device.gatt.connect();

                let targetCharacteristic = null;
                for (const serviceUuid of KNOWN_SERVICES) {
                    try {
                        const service = await server.getPrimaryService(serviceUuid);
                        const characteristics = await service.getCharacteristics();
                        for (const char of characteristics) {
                            if (char.properties.write || char.properties.writeWithoutResponse) {
                                targetCharacteristic = char;
                                break;
                            }
                        }
                        if (targetCharacteristic) break;
                    } catch (e) {}
                }

                if (!targetCharacteristic) {
                    throw new Error("書き込み可能なBluetoothキャラクタリスティックが見つかりませんでした。");
                }

                log('通信チャンネル接続成功。印字データ構築中...');

                const parts = [];
                parts.push(new Uint8Array([0x1B, 0x40])); // プリンター初期化

                if (title.trim() !== "" || body.trim() !== "") {
                    log('日本語テキストを画像データに変換中...');
                    const textCanvas = renderTextToCanvas(title, body);
                    const textCmd = convertCanvasToEscPos(textCanvas);
                    parts.push(textCmd);
                }

                if (loadedImage) {
                    log('QRコード画像をラスタコマンドに変換中...');
                    const qrCanvas = document.createElement('canvas');
                    const ctx = qrCanvas.getContext('2d');
                    const targetWidth = 384;
                    const scale = targetWidth / loadedImage.width;
                    const targetHeight = Math.floor(loadedImage.height * scale);
                    qrCanvas.width = targetWidth;
                    qrCanvas.height = targetHeight;
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(0, 0, targetWidth, targetHeight);
                    ctx.drawImage(loadedImage, 0, 0, targetWidth, targetHeight);

                    const qrCmd = convertCanvasToEscPos(qrCanvas);
                    parts.push(qrCmd);
                }

                // 最後に必ず10mm (80ドット)分の白い空白画像データを結合して余別を確保する
                log('10mmの余白データを追加中...');
                parts.push(createBottomMarginEscPos());

                const totalLength = parts.reduce((sum, p) => sum + p.length, 0);
                const payload = new Uint8Array(totalLength);
                let offset = 0;
                for (const part of parts) {
                    payload.set(part, offset);
                    offset += part.length;
                }

                log(`データを送信中 (合計: ${payload.length} バイト)...`);
                const CHUNK_SIZE = 256;
                for (let i = 0; i < payload.length; i += CHUNK_SIZE) {
                    const chunk = payload.slice(i, i + CHUNK_SIZE);
                    if (targetCharacteristic.properties.writeWithoutResponse) {
                        await targetCharacteristic.writeValueWithoutResponse(chunk);
                    } else {
                        await targetCharacteristic.writeValue(chunk);
                    }
                }

                log('印刷命令の送信が完了しました！', 'success');

            } catch (error) {
                console.error(error);
                log(`エラー: ${error.message}`, 'error');
            }
        });

        checkEnvironment();
    </script>

</body>
</html>
